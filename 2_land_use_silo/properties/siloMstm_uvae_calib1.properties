## DELIVERABLE 2026-06-17: ACS race + single-person marginals per state/year;
## composition-targeted migration steers the in/out draw toward these so the
## population diversifies and DC retains its single-person structure.
migration.target.marginals.file        = input/assumptions/migration_target_marginals.csv
## DELIVERABLE 2026-06-13: real (CPI-net) wage growth for income model
## Freeze-and-grow (2026-06-15): per-year real growth applied multiplicatively
## to each worker's current income. ACS 2023 target sits ~+7-8% above the 2016
## base (MD/DE); employed growth must slightly exceed that to offset the
## household-median drag from an aging (rising-retiree-share) population.
## 0.015/yr gave employed +11% but household median still fell (aging drag).
## 2026-06-16: paired with retirement replacement raised to 0.78 (was 0.6) to
## lift the growing retiree segment; 0.025/yr (~+19% employed over 7yr) helps the
## household median track the ACS-2023 target net of the demographic shift.
## Residual ~5% is the VAE base sitting below ACS-2016 (in the input pop).
real.wage.growth.rate                = 0.018

