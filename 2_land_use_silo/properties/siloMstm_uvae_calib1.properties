# When set to true, it OVERRIDES individual event flags — causing
# EducationEvent to run (~539K events/year) even when
# event.checkSchoolUniv = false. This graduates students to NotWorking
# faster than the employment model absorbs them, inflating NotWorking
# by ~8pp per simulation year (occupation SRMSE: 0.142 base → 0.323).
#
# With event.all.demography = false, ONLY explicitly enabled events run.
event.all.demography     = true

