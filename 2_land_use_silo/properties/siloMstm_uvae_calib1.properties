# --- AUTO OWNERSHIP MODEL ---
# The Maryland use case does NOT use a UEC Excel file for auto ownership.
# Instead, it uses a JavaScript calculator loaded as a classpath resource:
#   src/main/resources/de/tum/bgu/msm/models/autoOwnership/maryland/
#     UpdateCarOwnershipMstmCalc
#
# Model: MNL with 4 alternatives (0, 1, 2, 3+ cars)
# Inputs: hhSize (1-8), workers (0-4), income category (1-12),
#         transit accessibility (0-100), job density category (1-10)
# Transit accessibility and job density are computed internally by SILO
# from skim matrices and job allocation — no external input files needed.
#
# ASCs calibrated to 2016 ACS 1-Year PUMS (Maryland, FIPS 24):
#   1-car ASC:  2.942  (original: 2.258, delta: +0.684)
#   2-car ASC:  2.057  (original: 0.273, delta: +1.783)
#   3+-car ASC: -0.843 (original: -3.269, delta: +2.426)
#
# Deploy calibrated JS to:
#   useCases/maryland/src/main/resources/de/tum/bgu/msm/models/
#     autoOwnership/maryland/UpdateCarOwnershipMstmCalc
#
# These UEC properties are vestigial for the Maryland use case
# but kept for compatibility with the properties reader.
AutoOwnership.UEC.FileName                 = models/AutoOwnership.xls
AutoOwnership.UEC.DataSheetNumber          = 0
AutoOwnership.UEC.Ownership.Utility        = 1

# =============================================================================
# Demographic parameters
# =============================================================================
demographics.proability.girl               = 0.488
demographics.birth.scaler.married          = 2.243
demographics.birth.scaler.single           = 0.1
# DELIVERABLE 2026-06-17: was 0.87, producing ~70k births/yr (~0.6%/yr crude
# rate, ~half of reality) -> the 0-4 cohort validated at HALF the ACS share
# (MD 3.0% vs 5.9%), the dominant age-distribution gap. Raised to 1.7 (~2x) to
# bring the crude birth rate to ~1.1%/yr and the 0-4 share to ACS levels.
demographics.local.birth.rate.adjuster     = 1.9
# DELIVERABLE 2026-06-20: per-state birth & marriage factors calibrated to ACS
# fertility + marital status (cols: state,birthFactor,marriageFactor; keyed by
# STFIPS so MD/DE stay at 1.0). DC's fertility is ~28% below MD and its married
# share ~35% below, so the global 1.9x birth scaler over-births DC and the
# marriage model over-merges DC singles, inflating DC household size (2.37 vs
# ACS 1.94) and collapsing its single-person share. DC: birth 0.72 / marriage 0.65.
demographics.local.scalers.file            = input/assumptions/local_demographic_scalers.csv
# DELIVERABLE 2026-06-18: lift labor-force participation so workers/household
# reaches ACS (~1.35 vs SILO 1.23) — the main driver of the -7% household income
# gap (alongside missing non-wage income, addressed via retiree SS floor).
demographics.labor.participation.adjuster   = 1.08
demographics.min.age.for.legal.marriage    = 18
demographics.age.diff.of.partners.absolute = 2.3
demographics.age.diff.of.partners.spreadfc = 0.05
demographics.local.marriage.rate.adjuster  = 1.1
demographics.single.pers.hh.marriage.bias  = 2
demographics.interracial.marriage.share    = 0.02
move.or.not.binomial.log.model.parameter   = 10
move.or.not.binomial.log.shift.parameter   = 0.03
select.dwelling.mn.log.model.parameter     = 0.5
relevance.of.race.in.zone.of.dwelling      = 0.8
construct.dwelling.mn.log.model.beta       = 0.5
construct.dwelling.mn.log.model.inflator   = 1.5
dwelling.quality.levels.distinguished      = 4
mean.change.of.yearly.income               = 2000

