# VAE-SILO 2026-06-25: switched interpolation -> rate. The interpolation method
# targets the exogenous MSTM forecast file, whose 2016 PER-ZONE/TYPE distribution
# differs from our VAE workplace allocation by 2.35M jobs (28%); JobMarketUpdate
# then fired ~668k workers (11% of the workforce) in year 2016 alone to "match"
# it, and EmploymentModel re-hired them at the demographic-cell MEAN income —
# collapsing the income distribution toward the (right-skewed) mean and inflating
# the HH-income median +14-28% (the year-1 income/autos step seen in validation).
# The rate method sets the base-year forecast = our ACTUAL SP job counts per
# zone/type (zero base-year reshuffling) and grows them uniformly thereafter.
job.forecast.method      = rate
job.growth.rate          = 1.0
job.control.total        = input/assumptions/employmentForecast_ron_orig.csv
